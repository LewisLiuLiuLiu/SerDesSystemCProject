# CI：Linux + macOS 双平台构建与全量测试
#
# 设计说明：
# - SystemC 2.3.4 源码：accellera-official/systemc（官方）
# - SystemC-AMS 2.3.4 源码：Risto97/systemc-ams@v2.3.4（公开镜像，非官方；
#   如失效可通过仓库 Variables 覆盖 SYSTEMC_AMS_SRC_URL，或改用本地发布件）
# - 两个库与消费工程使用同一 C++ 标准（macOS=C++11 / Linux=C++14），
#   与工程内"平台自适应标准"策略一致（API 版本符号需匹配，见 README）。
# - 首次引入可能需要 1-2 轮修正（上游 URL/autotools 依赖），失败属正常迭代。
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

env:
  SYSTEMC_VERSION: "2.3.4"
  SYSTEMC_AMS_VERSION: "2.3.4"
  SYSTEMC_SRC_URL: "https://github.com/accellera-official/systemc/archive/refs/tags/2.3.4.tar.gz"
  SYSTEMC_AMS_SRC_URL: "https://github.com/Risto97/systemc-ams/archive/refs/tags/v2.3.4.tar.gz"

jobs:
  scripts-syntax:
    name: Bash syntax check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: bash -n on all scripts
        run: bash -n scripts/*.sh

  build-test:
    name: Build & ctest (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Toolchain deps (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential cmake autoconf automake libtool

      - name: Toolchain deps (macOS)
        if: runner.os == 'macOS'
        run: brew install cmake autoconf automake libtool

      - name: Cache SystemC/SystemC-AMS install
        uses: actions/cache@v4
        with:
          path: deps/install-2.3.4
          key: syscams-${{ runner.os }}-${{ env.SYSTEMC_VERSION }}-${{ env.SYSTEMC_AMS_VERSION }}

      - name: Build SystemC & SystemC-AMS (cache miss)
        run: |
          set -e
          PREFIX="$PWD/deps/install-2.3.4"
          if ls "$PREFIX"/lib/libsystemc-ams* >/dev/null 2>&1; then
            echo "deps cache hit"
            exit 0
          fi
          mkdir -p deps && cd deps
          if [ "$RUNNER_OS" = "macOS" ]; then
            STD=11; CXXSTD="gnu++11"
          else
            STD=14; CXXSTD="gnu++14"
          fi
          echo "lib C++ standard: C++$STD"

          # --- SystemC ---
          curl -L -o systemc.tar.gz "$SYSTEMC_SRC_URL"
          tar xzf systemc.tar.gz
          cmake -S systemc-2.3.4 -B systemc-build \
            -DCMAKE_INSTALL_PREFIX="$PREFIX" \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_CXX_STANDARD=$STD
          cmake --build systemc-build -j"$(nproc 2>/dev/null || sysctl -n hw.ncpu 2>/dev/null || echo 4)"
          cmake --install systemc-build

          # --- SystemC-AMS (autotools) ---
          curl -L -o systemc-ams.tar.gz "$SYSTEMC_AMS_SRC_URL"
          tar xzf systemc-ams.tar.gz
          cd "$(ls -d systemc-ams-* | head -1)"
          if [ ! -x ./configure ]; then autoreconf -fiv; fi
          ./configure --with-systemc="$PREFIX" --prefix="$PREFIX" CXXFLAGS="-std=$CXXSTD"
          make -j"$(nproc 2>/dev/null || sysctl -n hw.ncpu 2>/dev/null || echo 4)"
          make install

      - name: Configure project (BUILD_TESTING=ON)
        run: |
          cmake -S . -B build -DBUILD_TESTING=ON \
            -DSYSTEMC_HOME="$PWD/deps/install-2.3.4" \
            -DSYSTEMC_AMS_HOME="$PWD/deps/install-2.3.4"

      - name: Build all targets
        run: cmake --build build -j"$(nproc 2>/dev/null || sysctl -n hw.ncpu 2>/dev/null || echo 4)"

      - name: Run full test suite (ctest)
        run: cd build && ctest --output-on-failure -j4
