# CI：Linux + macOS 双平台构建与全量测试
#
# 设计说明：
# - SystemC 2.3.4 源码：accellera-official/systemc（官方）
# - SystemC-AMS 2.3.4 源码：Risto97/systemc-ams@v2.3.4（公开镜像，非官方；
#   如失效可通过仓库 Variables 覆盖 SYSTEMC_AMS_SRC_URL，或改用本地发布件）
# - 两个库均用 CMake 构建（AMS 2.3.4 自带 CMakeLists，避免 autotools 对
#   libsystemc.la 的依赖——CMake 安装的 SystemC 不带 .la 文件）。
# - SystemC 2.3.4 / AMS 的 cmake_minimum_required 低于 3.5，CMake 4 需放行：
#   统一传 -DCMAKE_POLICY_VERSION_MINIMUM=3.5（CMake 提示的标准做法）。
# - 两个库与消费工程使用同一 C++ 标准（macOS=C++11 / Linux=C++14），
#   与工程内"平台自适应标准"策略一致（API 版本符号需匹配，见 README）。
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

env:
  SYSTEMC_VERSION: "2.3.4"
  SYSTEMC_AMS_VERSION: "2.3.4"
  SYSTEMC_SRC_URL: "https://github.com/accellera-official/systemc/archive/refs/tags/2.3.4.tar.gz"
  SYSTEMC_AMS_SRC_URL: "https://github.com/Risto97/systemc-ams/archive/refs/tags/v2.3.4.tar.gz"

jobs:
  scripts-syntax:
    name: Bash syntax check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: bash -n on all scripts
        run: bash -n scripts/*.sh

  build-test:
    name: Build & ctest (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Toolchain deps (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential cmake

      - name: Toolchain deps (macOS)
        if: runner.os == 'macOS'
        run: brew install cmake

      - name: Cache SystemC/SystemC-AMS install
        uses: actions/cache@v4
        with:
          path: deps/install-2.3.4
          key: syscams-${{ runner.os }}-${{ env.SYSTEMC_VERSION }}-${{ env.SYSTEMC_AMS_VERSION }}

      - name: Build SystemC & SystemC-AMS (cache miss)
        run: |
          set -e
          PREFIX="$PWD/deps/install-2.3.4"
          if ls "$PREFIX"/lib/libsystemc-ams* >/dev/null 2>&1; then
            echo "deps cache hit"
            exit 0
          fi
          mkdir -p deps && cd deps
          if [ "$RUNNER_OS" = "macOS" ]; then
            STD=11
          else
            STD=14
          fi
          echo "libraries C++ standard: C++$STD"
          JOBS="$(nproc 2>/dev/null || sysctl -n hw.ncpu 2>/dev/null || echo 4)"

          # --- SystemC 2.3.4（CMake） ---
          curl -L -o systemc.tar.gz "$SYSTEMC_SRC_URL"
          tar xzf systemc.tar.gz
          cmake -S systemc-2.3.4 -B systemc-build \
            -DCMAKE_INSTALL_PREFIX="$PREFIX" \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_CXX_STANDARD=$STD \
            -DCMAKE_POLICY_VERSION_MINIMUM=3.5
          cmake --build systemc-build -j"$JOBS"
          cmake --install systemc-build

          # --- SystemC-AMS 2.3.4（CMake，替代 autotools） ---
          curl -L -o systemc-ams.tar.gz "$SYSTEMC_AMS_SRC_URL"
          tar xzf systemc-ams.tar.gz
          cmake -S systemc-ams-2.3.4 -B ams-build \
            -DCMAKE_INSTALL_PREFIX="$PREFIX" \
            -DCMAKE_BUILD_TYPE=Release \
            -DSYSTEMC_HOME="$PREFIX" \
            -DCMAKE_CXX_STANDARD=$STD \
            -DCMAKE_POLICY_VERSION_MINIMUM=3.5
          cmake --build ams-build -j"$JOBS"
          cmake --install ams-build

      - name: Configure project (BUILD_TESTING=ON)
        run: |
          cmake -S . -B build -DBUILD_TESTING=ON \
            -DSYSTEMC_HOME="$PWD/deps/install-2.3.4" \
            -DSYSTEMC_AMS_HOME="$PWD/deps/install-2.3.4"

      - name: Build all targets
        run: cmake --build build -j"$(nproc 2>/dev/null || sysctl -n hw.ncpu 2>/dev/null || echo 4)"

      - name: Run full test suite (ctest)
        run: |
          cd build
          set +e
          ctest --output-on-failure -j4 2>&1 | tee ctest.log
          rc=${PIPESTATUS[0]}
          if [ $rc -ne 0 ]; then
            # 把失败测试名与 gtest 断言上下文转成 annotation（公开 check-runs
            # API 可匿名读取，便于在无法访问 Actions 日志的环境下定位失败）
            awk '/The following tests FAILED/{flag=1} flag' ctest.log | sed 's/^/::error::/' || true
            grep -E "\[vref-loop\]|Failure$|Expected:|Actual:|evaluates to|Which is:" ctest.log \
              | head -40 | sed 's/^/::error::/' || true
          fi
          exit $rc
